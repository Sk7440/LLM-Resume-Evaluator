services:
  - type: web
    name: llm-resume-evaluator-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FRONTEND_ORIGIN
        value: https://llm-resume-evaluator.vercel.app
